name: Build mod
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare project from Forge MDK
        run: |
          unzip -q jupiter2011-forge-1.20.1.zip
          curl -L -o mdk.zip https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.3.0/forge-1.20.1-47.3.0-mdk.zip
          unzip -q mdk.zip -d mdk
          rm -rf mdk/src
          cp -r jupiter2011/src mdk/src
          sed -i 's/^mod_id=.*/mod_id=jupiter2011/' mdk/gradle.properties
      - name: Build
        working-directory: mdk
        run: |
          chmod +x gradlew
          ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: jupiter2011-mod
          path: mdk/build/libs/*.jar
